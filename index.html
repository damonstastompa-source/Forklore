<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1513"><meta name="description" content="Forklore — an offline recipe book for recipes worth remembering."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="forklore-icon.png"><link rel="apple-touch-icon" href="forklore-icon.png"><link rel="stylesheet" href="styles.css"><title>Forklore</title></head><body>
<div id="app" class="app"><header class="topbar"><button class="icon-btn" id="menuBtn" aria-label="Open menu">☰</button><div class="brand"><img class="brand-logo" src="forklore-icon.png" alt="Forklore logo"><span>Forklore</span></div><button class="add-btn" id="addBtn" aria-label="Add recipe">+</button></header>
<main id="main" class="main"></main>
<nav id="drawer" class="drawer" aria-hidden="true"><div class="drawer-head"><div class="brand"><img class="brand-logo" src="forklore-icon.png" alt="Forklore logo">Forklore</div><button class="icon-btn" id="closeMenu">×</button></div><button data-view="recipes">▣ <span>Recipes</span></button><button data-view="favorites">♡ <span>Favorites</span></button><button data-view="categories">◉ <span>Categories</span></button><button data-view="shopping">🛒 <span>Shopping List</span></button><button data-view="settings">⚙ <span>Settings</span></button><button data-view="about">ⓘ <span>About</span></button></nav><div id="scrim" class="scrim"></div>
<div id="modal" class="modal" aria-hidden="true"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Add Recipe</h2><button class="icon-btn" id="closeModal">×</button></div><form id="recipeForm"><label>Recipe name<input id="rName" required placeholder="Chicken Alfredo"></label><div class="two"><label>Prep (min)<input id="rPrep" type="number" min="0" value="15"></label><label>Cook (min)<input id="rCook" type="number" min="0" value="25"></label></div><div class="two"><label>Servings<input id="rServings" type="number" min="1" value="4"></label><label>Difficulty<select id="rDifficulty"><option>Easy</option><option>Medium</option><option>Hard</option></select></label></div><label>Photo<input id="rPhoto" type="file" accept="image/*" capture="environment"></label><div id="photoPreview" class="photo-preview"></div><label>Tags <small>comma separated</small><input id="rTags" placeholder="Italian, Pasta, Dinner"></label><label>Ingredients <small>one per line</small><textarea id="rIngredients" rows="7" placeholder="1 lb chicken breast\n12 oz fettuccine\n2 tbsp butter"></textarea></label><label>Instructions <small>one step per line</small><textarea id="rInstructions" rows="7" placeholder="Season and sear the chicken.\nCook pasta until al dente.\nMake the sauce."></textarea></label><label>Chef's notes<textarea id="rNotes" rows="4" placeholder="What would you change next time?"></textarea></label><button class="primary full" type="submit">Save Recipe</button></form></div></div>
<div id="toast" class="toast"></div><script src="app.js"></script></div></body></html>
